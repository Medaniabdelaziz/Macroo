<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>ماكرو الشرطة</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0a0a0a;
            padding: 12px;
        }

        /* ===== الحاوية الرئيسية ===== */
        .container {
            background: #111;
            border: 1px solid #222;
            border-radius: 24px;
            padding: 20px 18px;
            max-width: 700px;
            width: 100%;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.8);
            transition: 0.2s;
            min-height: 90vh;
            display: flex;
            flex-direction: column;
        }

        /* ===== الشعار والعنوان المصغر ===== */
        .header {
            text-align: center;
            margin-bottom: 12px;
            flex-shrink: 0;
        }

        .logo-img {
            width: 55px;
            height: 55px;
            object-fit: contain;
            filter: drop-shadow(0 0 8px rgba(212, 160, 23, 0.15));
            border-radius: 12px;
            margin-bottom: 4px;
        }

        .main-title {
            color: #f0e6d0;
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 0.5px;
            line-height: 1.3;
        }

        .subtitle {
            color: #777;
            font-size: 15px;
            border-bottom: 1px solid #1f1f1f;
            padding-bottom: 10px;
            margin-top: 2px;
        }

        /* ===== إخفاء العنوان في صفحة النتائج ===== */
        .results-section .header .main-title,
        .results-section .header .subtitle {
            display: none;
        }

        /* ========== صفحة الإدخال ========== */
        .input-section {
            display: flex;
            flex-direction: column;
            flex: 1;
            justify-content: center;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 20px;
        }

        .input-group label {
            color: #c0b28a;
            font-size: 17px;
            font-weight: 700;
            text-align: right;
        }

        .input-group input {
            padding: 14px 18px;
            font-size: 18px;
            font-family: 'Tajawal', sans-serif;
            border: 2px solid #2a2a2a;
            border-radius: 30px;
            background: #0a0a0a;
            color: #eee;
            outline: none;
            transition: 0.3s;
            box-shadow: inset 0 2px 6px rgba(0,0,0,0.6);
            width: 100%;
        }

        .input-group input:focus {
            border-color: #d4a017;
            background: #141414;
        }

        .input-group input::placeholder {
            color: #555;
            font-size: 16px;
        }

        /* النص التوضيحي الجديد */
        .input-hint {
            color: #666;
            font-size: 14px;
            text-align: right;
            margin-top: 4px;
            padding-right: 6px;
            letter-spacing: 0.3px;
        }

        .btn-primary {
            padding: 15px;
            font-size: 22px;
            font-weight: 700;
            font-family: 'Tajawal', sans-serif;
            background: #1a1a1a;
            border: 2px solid #d4a017;
            border-radius: 30px;
            color: #d4a017;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            min-height: 58px;
        }

        .btn-primary:active {
            transform: scale(0.97);
            background: #d4a017;
            color: #000;
        }

        /* ========== صفحة التحميل ========== */
        .loading-section {
            display: none;
            text-align: center;
            padding: 40px 10px;
            flex: 1;
            justify-content: center;
            flex-direction: column;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #222;
            border-top: 4px solid #d4a017;
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
            margin: 15px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-section h2 {
            color: #f5e7c8;
            font-size: 24px;
        }
        .loading-section p {
            color: #aaa;
            font-size: 20px;
        }
        .loading-section .officer-name {
            color: #d4a017;
        }

        /* ========== صفحة النتائج ========== */
        .results-section {
            display: none;
            flex: 1;
            flex-direction: column;
        }

        .results-welcome {
            color: #f5e7c8;
            font-size: 22px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 4px;
            flex-shrink: 0;
        }
        .results-welcome .name {
            color: #d4a017;
        }

        .results-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            margin: 6px 0 12px 0;
            flex-shrink: 0;
        }

        .macro-counter {
            color: #888;
            font-size: 15px;
        }

        .back-btn {
            background: transparent;
            border: 1px solid #333;
            color: #888;
            padding: 8px 18px;
            border-radius: 30px;
            cursor: pointer;
            font-family: 'Tajawal', sans-serif;
            font-size: 16px;
            transition: 0.2s;
            min-height: 44px;
        }
        .back-btn:active {
            border-color: #d4a017;
            color: #d4a017;
        }

        /* ===== قائمة الماكروات (قابلة للتمرير) ===== */
        .macro-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow-y: auto;
            padding-left: 2px;
            padding-bottom: 10px;
            flex: 1;
            max-height: 580px;
        }

        .macro-list::-webkit-scrollbar {
            width: 4px;
        }
        .macro-list::-webkit-scrollbar-track {
            background: #111;
        }
        .macro-list::-webkit-scrollbar-thumb {
            background: #d4a017;
            border-radius: 10px;
        }

        /* ===== عناوين الأقسام (إطار خفيف جداً) ===== */
        .section-header {
            color: #d4a017;
            font-size: 18px;
            font-weight: 700;
            padding: 8px 12px;
            margin: 6px 0 2px 0;
            border-right: 2px solid #d4a017;
            background: #151515;
            border-radius: 8px;
            border: 1px solid rgba(255, 215, 0, 0.06);
            text-align: right;
            flex-shrink: 0;
        }

        /* ===== عنصر الماكرو (إطار شفاف تقريباً) ===== */
        .macro-item {
            background: #0d0d0d;
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 14px;
            padding: 14px 16px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            transition: 0.15s;
        }

        .macro-item:active {
            background: #161616;
        }

        .macro-item .row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        /* النص طويل وواضح */
        .macro-item .text {
            color: #eee;
            font-size: 20px;
            font-family: 'Tajawal', monospace;
            line-height: 1.8;
            word-break: break-word;
            flex: 1;
            text-align: right;
            font-weight: 500;
            letter-spacing: 0.2px;
        }

        /* زر النسخ مناسب للإصبع */
        .macro-item .copy-btn {
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            color: #aaa;
            padding: 10px 18px;
            border-radius: 40px;
            cursor: pointer;
            font-family: 'Tajawal', sans-serif;
            font-size: 17px;
            transition: 0.2s;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 6px;
            min-height: 48px;
            min-width: 70px;
            justify-content: center;
        }

        .macro-item .copy-btn:active {
            background: #d4a017;
            color: #000;
            border-color: #d4a017;
        }

        /* رسالة "تم نسخ" أسفل الماكرو */
        .macro-item .copy-feedback {
            color: #2d7d46;
            font-size: 18px;
            font-weight: 700;
            display: none;
            text-align: right;
            padding-right: 10px;
            border-right: 3px solid #2d7d46;
        }
        .macro-item .copy-feedback.show {
            display: block;
        }

        .footer {
            text-align: center;
            color: #1f1f1f;
            font-size: 12px;
            margin-top: 12px;
            flex-shrink: 0;
        }

        /* ========================================== */
        /* ===== تحسينات خاصة للهواتف ===== */
        /* ========================================== */
        @media (max-width: 600px) {
            body { padding: 8px; }
            .container {
                padding: 16px 14px;
                border-radius: 20px;
                min-height: 95vh;
            }
            .main-title { font-size: 18px; }
            .logo-img { width: 48px; height: 48px; }
            .input-group input {
                font-size: 17px;
                padding: 14px 16px;
            }
            .input-hint {
                font-size: 13px;
            }
            .btn-primary {
                font-size: 20px;
                padding: 14px;
                min-height: 54px;
            }
            .macro-item .text {
                font-size: 18px;
                line-height: 1.7;
            }
            .macro-item .copy-btn {
                font-size: 15px;
                padding: 8px 14px;
                min-height: 44px;
                min-width: 60px;
            }
            .section-header {
                font-size: 16px;
                padding: 6px 10px;
            }
            .results-welcome {
                font-size: 20px;
            }
            .back-btn {
                font-size: 14px;
                padding: 6px 14px;
                min-height: 40px;
            }
            .macro-item .copy-feedback {
                font-size: 16px;
            }
            .macro-list {
                max-height: 450px;
                gap: 10px;
            }
        }

        @media (max-width: 400px) {
            .macro-item .text {
                font-size: 16px;
            }
            .macro-item .row {
                flex-direction: column;
                align-items: stretch;
            }
            .macro-item .copy-btn {
                align-self: flex-start;
                width: 100%;
                justify-content: center;
            }
            .macro-list {
                max-height: 380px;
            }
        }
    </style>
</head>
<body>

<div class="container" id="mainContainer">

    <!-- ===== الهيدر (شعار + عنوان مصغر) ===== -->
    <div class="header" id="mainHeader">
        <img class="logo-img" src="https://i.ibb.co/0R8BwjGZ/1000590795.png" alt="لوجو">
        <h1 class="main-title" id="mainTitle">ماكرو الشرطة سيرفر HEMET ME</h1>
        <div class="subtitle" id="globalSubtitle">أدخل اسمك لإنشاء الأوامر</div>
    </div>

    <!-- ===== صفحة الإدخال ===== -->
    <div class="input-section" id="inputSection">
        <div class="input-group">
            <label for="officerName">✦ اسم الضابط</label>
            <input type="text" id="officerName" placeholder="مثال: خالد الفهد" autofocus>
            <!-- النص التوضيحي الجديد -->
            <div class="input-hint">✎ يرجى إدخال اسمك كما في اللعبة</div>
        </div>
        <button class="btn-primary" id="generateBtn">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M5 12h14M12 5l7 7-7 7" />
            </svg>
            إنشاء الماكرو
        </button>
        <div class="footer">© 2026 - جميع الحقوق محفوظة</div>
    </div>

    <!-- ===== صفحة التحميل ===== -->
    <div class="loading-section" id="loadingSection">
        <h2>⏳ جاري الإنشاء</h2>
        <div class="spinner"></div>
        <p>مرحباً، <span class="officer-name" id="loadingOfficerName">الضابط</span></p>
        <p style="font-size: 15px; color: #555; margin-top: 6px;">يرجى الانتظار...</p>
    </div>

    <!-- ===== صفحة النتائج ===== -->
    <div class="results-section" id="resultsSection">
        <div class="results-welcome">
            👋 مرحباً، <span class="name" id="welcomeName">الضابط</span>
        </div>

        <div class="results-toolbar">
            <span class="macro-counter">📋 <span id="macroCount">0</span> أمر</span>
            <button class="back-btn" id="backBtn">⟲ تغيير الضابط</button>
        </div>

        <div class="macro-list" id="macroList"></div>
        <div class="footer">© 2026 - جميع الحقوق محفوظة</div>
    </div>

</div>

<script>
    // ============================================================
    //  بيانات الماكروات (منظمة وواضحة)
    // ============================================================
    const sections = [
        {
            title: "⚡ قسم التحذيرات",
            commands: [
                '/me  -1-توقف فورًا عن الحركة! هذا آخر تحذير، إذا لم تمتثل للأوامر، سيتم استخدام الصاعق الكهربائي ضدك!',
                '/me  -2-تحذير أخير! ألق سلاحك فورًا وامتثل للأوامر، وإلا سيتم استخدام القوة المميتة ضدك!',
                '/me  -3-من فضلك، أحتاج الاطلاع على جواز سفرك للتحقق من سجل المخالفات، ونأمل منك التعاون معنا.',
                '/me  -4-تم التحقق من جواز سفرك، وسجلك نظيف. شكرًا لتعاونك.',
                '/do  -5-مرحبًا، أنا الضابط (اسمك) وأنت الآن رهن الاعتقال بسبب انتهاك للقانون. لك الحق في التزام الصمت، وأي شيء تقوله قد يستخدم ضدك. تعاونك مطلوب أثناء الإجراءات.',
                '/do  -6-مرحبًا، أنا الضابط (اسمك) وبسبب وجود مخالفات في جواز سفرك، أنت الآن رهن الاعتقال. لك الحق في الصمت وطلب محامٍ. نرجو منك التعاون أثناء الإجراءات.',
                '/do  -7-مرحبًا، أنا الضابط (اسمك) وأنت مطلوب بموجب مذكرة توقيف، ولهذا السبب تم اعتقالك. لك الحق في الصمت وطلب محامٍ، ونرجو منك التعاون معنا.',
                '/do  -8-تحذير: التواجد داخل المستشفى لأكثر من دقيقة بدون تصريح قانوني سيؤدي إلى اعتقالك فورًا.',
                '/do  -9-يرجى مغادرة مركز الشرطة فورًا إذا لم يكن هناك سبب لوجودك! وإلا سوف يتم اعتقالك',
                '/me  -10-تحذير: هذه المنطقة تحت سيطرة الشرطة لأسباب أمنية. يطلب من الجميع مغادرتها فورًا، وأي مخالفة ستقابل بإجراءات صارمة.'
            ]
        },
        {
            title: "🚨 1- المخالفات جناية ( 20 دقيقة )",
            commands: [
                '/do 1.1 الاستيلاء على مؤسسات الدولة [+20 دقيقة]',
                '/do 1.2 الاستيلاء على السلطة بالقوة؛  [+20 دقيقة]',
                '/do 1.3 أخذ الرهائن أو الاختطاف [+20 دقيقة]',
                '/do 1.4 الاصطدام المميت بالمشاة [+20 دقيقة]',
                '/do 1.5 محاولة السرقة [+20 دقيقة]',
                '/do 1.5.1 سرقة بنك أو محاولة سرقة بنك [+20 دقيقة]',
                '/do 1.6 سرقة ضابط شرطة [+20 دقيقة]',
                '/do 1.7 الدخول غير المنسق إلى الأراضي المحمية بالقانون [+20 دقيقة]',
                '/do 1.8 الاصطدام بالمشاة [+20 دقيقة]',
                '/do 1.9إشهار سلاح في مكان عام / اطلاق النار [+20 دقيقة]',
                '/do 1.10 رشوة ضابط شرطة [+20 دقيقة]'
            ]
        },
        {
            title: "🔹 2- المخالفات انتهاك ( 10 دقائق )",
            commands: [
                '/do 2.1 إتلاف ممتلكات الدولة [+10 دقائق]',
                '/do 2.2 الإضرار أو التلف بالممتلكات الخاصة  [+10 دقائق]',
                '/do 2.3 مكالمات كاذبة للشرطة و/أو خدمات الطوارئ [+10 دقائق]',
                '/do 2.4 الفجور (تشغيل الموسيقى بعد أن يُطلب منك إيقاف تشغيلها/البصق في وجه شخص ما، إلخ) [+10 دقائق]',
                '/do 2.5 التهديد بالقتل [+10 دقائق]',
                '/do 2.6 إهانة موظف حكومي [+10 دقائق]',
                '/do 2.7 الابتزاز [+10 دقائق]'
            ]
        },
        {
            title: "🔸 3- المخالفات جنحة ( 5 دقائق )",
            commands: [
                '/do 3.1 مقاومة الاعتقال [+5 دقائق]',
                '/do 3.2 عصيان ضابط الشرطة [+5 دقائق]',
                '/do 3.3 المساعدة في مقاومة الاعتقال [+5 دقائق]',
                '/do 3.4 انتهاك قواعد المرور: القيادة في المسار المعاكس، الاصطدام بالأعمدة، تجاوز الإشارات الحمراء [+5 دقائق]',
                '/do 3.5 الاعتداء على مدني (ضرب) [+5 دقائق]',
                '/do 3.6 رفض تقديم المستندات المطلوبة: بطاقة الهوية، ومستندات السيارة، ورخص الأسلحة[+5 دقائق]'
            ]
        },
        {
            title: "📡 أوامر الفلوبي (Floppy)",
            commands: [
                '/flobby تسجيل دخول [ — ]',
                '/flobby تسجيل خروج [ — ]',
                '/flobby أطلب الإذن لدخول مكتب [ — ]',
                '/flobby أطلب دعم',
                '/flobby الموقع',
                '/flobby إستجابة'
            ]
        }
    ];

    // ============================================================
    //  عناصر DOM
    // ============================================================
    const header = document.getElementById('mainHeader');
    const mainTitle = document.getElementById('mainTitle');
    const globalSubtitle = document.getElementById('globalSubtitle');

    const inputSection = document.getElementById('inputSection');
    const loadingSection = document.getElementById('loadingSection');
    const resultsSection = document.getElementById('resultsSection');

    const nameInput = document.getElementById('officerName');
    const generateBtn = document.getElementById('generateBtn');
    const loadingOfficerName = document.getElementById('loadingOfficerName');
    const welcomeName = document.getElementById('welcomeName');
    const macroList = document.getElementById('macroList');
    const macroCount = document.getElementById('macroCount');
    const backBtn = document.getElementById('backBtn');

    // ============================================================
    //  دوال العرض الأساسية
    // ============================================================
    function showStage(stage, name = '') {
        inputSection.style.display = 'none';
        loadingSection.style.display = 'none';
        resultsSection.style.display = 'none';

        if (stage === 'input') {
            inputSection.style.display = 'flex';
            mainTitle.style.display = 'block';
            globalSubtitle.style.display = 'block';
            globalSubtitle.textContent = 'أدخل اسمك لإنشاء الأوامر';
        } else if (stage === 'loading') {
            loadingSection.style.display = 'flex';
            mainTitle.style.display = 'block';
            globalSubtitle.style.display = 'block';
            globalSubtitle.textContent = 'جاري الإنشاء...';
            loadingOfficerName.textContent = name || 'الضابط';
        } else if (stage === 'results') {
            resultsSection.style.display = 'flex';
            mainTitle.style.display = 'none';
            globalSubtitle.style.display = 'none';
            welcomeName.textContent = name || 'الضابط';
        }
    }

    // ============================================================
    //  عرض النتائج (بناء القائمة)
    // ============================================================
    function displayResults(name) {
        macroList.innerHTML = '';
        let total = 0;

        sections.forEach(section => {
            // عنوان القسم
            const headerDiv = document.createElement('div');
            headerDiv.className = 'section-header';
            headerDiv.textContent = section.title;
            macroList.appendChild(headerDiv);

            // أوامر القسم
            section.commands.forEach(cmd => {
                const replaced = cmd.replace(/\(اسمك\)/g, name);
                const item = document.createElement('div');
                item.className = 'macro-item';

                const row = document.createElement('div');
                row.className = 'row';

                const textSpan = document.createElement('span');
                textSpan.className = 'text';
                textSpan.textContent = replaced;

                const copyBtn = document.createElement('button');
                copyBtn.className = 'copy-btn';
                copyBtn.innerHTML = '📋 نسخ';

                const feedback = document.createElement('div');
                feedback.className = 'copy-feedback';
                feedback.textContent = '✅ تم نسخ!';

                // حدث النسخ (متوافق مع الهواتف)
                copyBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    // محاولة النسخ عبر Clipboard API
                    if (navigator.clipboard && navigator.clipboard.writeText) {
                        navigator.clipboard.writeText(replaced).then(() => {
                            feedback.classList.add('show');
                            setTimeout(() => feedback.classList.remove('show'), 2200);
                        }).catch(() => fallbackCopy(replaced, feedback));
                    } else {
                        fallbackCopy(replaced, feedback);
                    }
                });

                // دالة احتياطية للنسخ (للأجهزة القديمة)
                function fallbackCopy(text, fb) {
                    const temp = document.createElement('textarea');
                    temp.value = text;
                    temp.style.position = 'fixed';
                    temp.style.opacity = '0';
                    document.body.appendChild(temp);
                    temp.select();
                    try {
                        document.execCommand('copy');
                        fb.classList.add('show');
                        setTimeout(() => fb.classList.remove('show'), 2200);
                    } catch (err) {
                        alert('تعذر النسخ، الرجاء نسخ النص يدوياً.');
                    }
                    document.body.removeChild(temp);
                }

                row.appendChild(textSpan);
                row.appendChild(copyBtn);
                item.appendChild(row);
                item.appendChild(feedback);
                macroList.appendChild(item);
                total++;
            });
        });

        macroCount.textContent = total;
        showStage('results', name);
    }

    // ============================================================
    //  إنشاء الماكرو (مع الحفظ)
    // ============================================================
    function generateMacro() {
        const name = nameInput.value.trim();
        if (!name) {
            alert('الرجاء إدخال اسم الضابط أولاً.');
            nameInput.focus();
            return;
        }

        // حفظ الاسم في المتصفح
        localStorage.setItem('officerName', name);

        showStage('loading', name);

        // محاكاة سرعة الإنشاء (1 ثانية)
        setTimeout(() => {
            displayResults(name);
        }, 1000);
    }

    // ============================================================
    //  العودة لإدخال اسم جديد (مسح الحفظ)
    // ============================================================
    function goBack() {
        localStorage.removeItem('officerName');
        showStage('input');
        nameInput.value = '';
        nameInput.focus();
    }

    // ============================================================
    //  التحقق من الاسم المحفوظ عند تحميل الصفحة
    // ============================================================
    function checkSavedName() {
        const saved = localStorage.getItem('officerName');
        if (saved) {
            displayResults(saved);
        } else {
            showStage('input');
            nameInput.focus();
        }
    }

    // ============================================================
    //  ربط الأحداث
    // ============================================================
    generateBtn.addEventListener('click', generateMacro);
    backBtn.addEventListener('click', goBack);
    nameInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') generateBtn.click();
    });

    // منع التكبير التلقائي عند النقر على الحقل (تحسين للآيفون)
    nameInput.addEventListener('focus', () => {
        setTimeout(() => nameInput.scrollIntoView({ behavior: 'smooth', block: 'center' }), 300);
    });

    // بدء التشغيل
    window.addEventListener('DOMContentLoaded', checkSavedName);
</script>

</body>
</html>
